name: Python Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f python_tutorial_project/requirements.txt ]; then pip install -r python_tutorial_project/requirements.txt; fi

    - name: Run tests
      run: |
        cd python_tutorial_project
        python run_tests.py
